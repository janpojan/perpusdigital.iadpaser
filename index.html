<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Perpustakaan Digital IAD Paser</title>
  <style>
    :root {
      --bg-base: #f5f5f7;
      --bg-gradient: radial-gradient(circle at 12% 10%, rgba(0, 113, 227, 0.10), transparent 42%),
                     radial-gradient(circle at 88% 15%, rgba(88, 86, 214, 0.09), transparent 45%),
                     radial-gradient(circle at 50% 95%, rgba(52, 199, 89, 0.07), transparent 45%),
                     #f5f5f7;
      --glass-bg: rgba(255, 255, 255, 0.76);
      --glass-bg-strong: rgba(255, 255, 255, 0.92);
      --glass-border: rgba(255, 255, 255, 0.85);
      --card-border: rgba(0, 0, 0, 0.07);
      --text-primary: #1d1d1f;
      --text-secondary: #6e6e73;
      --text-tertiary: #86868b;
      --accent: #0071e3;
      --accent-hover: #0077ed;
      --accent-soft: rgba(0, 113, 227, 0.11);
      --success: #28a745;
      --warning: #f59e0b;
      --danger: #ff3b30;
      --shadow-sm: 0 4px 16px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 12px 32px rgba(0, 0, 0, 0.07);
      --shadow-lg: 0 24px 60px rgba(0, 0, 0, 0.14);
      --radius-xl: 24px;
      --radius-lg: 18px;
      --radius-md: 12px;
      --radius-pill: 999px;
      --grid-min: 230px;
    }

    body.dark-mode {
      --bg-base: #0b0c10;
      --bg-gradient: radial-gradient(circle at 15% 10%, rgba(10, 132, 255, 0.18), transparent 42%),
                     radial-gradient(circle at 85% 15%, rgba(94, 92, 230, 0.16), transparent 45%),
                     #0b0c10;
      --glass-bg: rgba(28, 28, 32, 0.76);
      --glass-bg-strong: rgba(34, 34, 38, 0.94);
      --glass-border: rgba(255, 255, 255, 0.12);
      --card-border: rgba(255, 255, 255, 0.09);
      --text-primary: #f5f5f7;
      --text-secondary: #a1a1a6;
      --text-tertiary: #6e6e73;
      --accent: #0a84ff;
      --accent-hover: #409cff;
      --accent-soft: rgba(10, 132, 255, 0.18);
      --shadow-sm: 0 4px 16px rgba(0, 0, 0, 0.25);
      --shadow-md: 0 12px 32px rgba(0, 0, 0, 0.35);
      --shadow-lg: 0 24px 60px rgba(0, 0, 0, 0.55);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-primary);
      line-height: 1.5;
      min-height: 100vh;
      overflow-x: hidden;
      transition: background 0.3s ease, color 0.3s ease;
    }

    /* Header */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 90;
      background: var(--glass-bg);
      backdrop-filter: blur(22px) saturate(180%);
      -webkit-backdrop-filter: blur(22px) saturate(180%);
      border-bottom: 1px solid var(--card-border);
      padding: 12px 24px;
    }

    .header-inner {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-logo {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      background: linear-gradient(135deg, var(--accent), #5856d6);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      box-shadow: 0 6px 18px rgba(0, 113, 227, 0.28);
      flex-shrink: 0;
    }

    .brand-text {
      min-width: 0;
    }

    .brand-title {
      font-size: 1.08rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-sub {
      font-size: 0.76rem;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-search {
      flex: 1;
      max-width: 420px;
      position: relative;
    }

    .header-search input {
      width: 100%;
      padding: 10px 16px 10px 38px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--card-border);
      background: rgba(120, 120, 128, 0.10);
      color: var(--text-primary);
      font-size: 0.9rem;
      outline: none;
      transition: all 0.2s ease;
    }

    .header-search input:focus {
      background: var(--glass-bg-strong);
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .header-search svg {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-secondary);
      pointer-events: none;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 9px 16px;
      border-radius: var(--radius-pill);
      border: 1px solid transparent;
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
      font-family: inherit;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 4px 14px rgba(0, 113, 227, 0.25);
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-glass {
      background: var(--glass-bg-strong);
      color: var(--text-primary);
      border-color: var(--card-border);
      box-shadow: var(--shadow-sm);
    }

    .btn-glass:hover {
      border-color: var(--accent);
    }

    .btn-danger {
      background: rgba(255, 59, 48, 0.12);
      color: var(--danger);
      border-color: rgba(255, 59, 48, 0.25);
    }

    .btn-sm {
      padding: 6px 12px;
      font-size: 0.8rem;
    }

    .profile-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 5px 12px 5px 6px;
      border-radius: var(--radius-pill);
      background: var(--glass-bg-strong);
      border: 1px solid var(--card-border);
      cursor: pointer;
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--text-primary);
      box-shadow: var(--shadow-sm);
    }

    .profile-chip-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--accent-soft);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      overflow: hidden;
      flex-shrink: 0;
    }

    .profile-chip-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Announcement Banner */
    .announcement-bar {
      max-width: 1400px;
      margin: 14px auto 0;
      padding: 0 24px;
    }

    .announcement-inner {
      background: linear-gradient(135deg, var(--accent-soft), rgba(88, 86, 214, 0.10));
      border: 1px solid rgba(0, 113, 227, 0.22);
      border-radius: var(--radius-lg);
      padding: 11px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 0.86rem;
    }

    /* Main Layout */
    .app-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px 24px 60px;
      display: grid;
      grid-template-columns: 270px 1fr;
      gap: 24px;
      align-items: start;
    }

    /* Left Sidebar */
    .sidebar {
      position: sticky;
      top: 82px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-xl);
      padding: 18px;
      box-shadow: var(--shadow-sm);
    }

    .visitor-widget {
      background: linear-gradient(145deg, var(--glass-bg-strong), var(--accent-soft));
      border: 1px solid rgba(0, 113, 227, 0.18);
    }

    .visitor-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .visitor-label {
      font-size: 0.76rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-secondary);
    }

    .live-dot {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--success);
    }

    .live-dot::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 0 3px rgba(40, 167, 69, 0.22);
    }

    .visitor-count {
      font-size: 1.85rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--accent);
      line-height: 1.15;
    }

    .visitor-note {
      font-size: 0.76rem;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .sidebar-section-title {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-tertiary);
      margin-bottom: 10px;
      padding: 0 6px;
    }

    .cat-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .cat-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 9px 12px;
      border-radius: var(--radius-md);
      border: none;
      background: transparent;
      color: var(--text-primary);
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: all 0.18s ease;
      font-family: inherit;
    }

    .cat-btn:hover {
      background: rgba(120, 120, 128, 0.10);
    }

    .cat-btn.active {
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(0, 113, 227, 0.25);
    }

    .cat-badge {
      font-size: 0.74rem;
      padding: 2px 8px;
      border-radius: var(--radius-pill);
      background: rgba(120, 120, 128, 0.14);
      color: inherit;
    }

    .cat-btn.active .cat-badge {
      background: rgba(255, 255, 255, 0.24);
    }

    /* Main Content Area */
    .main-content {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .hero-panel {
      background: linear-gradient(135deg, var(--glass-bg-strong), var(--accent-soft));
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-xl);
      padding: 24px 28px;
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    .hero-copy h1 {
      font-size: 1.55rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      margin-bottom: 6px;
    }

    .hero-copy p {
      font-size: 0.92rem;
      color: var(--text-secondary);
      max-width: 600px;
    }

    .hero-stats {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .stat-pill {
      background: var(--glass-bg-strong);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 10px 16px;
      min-width: 105px;
      text-align: center;
    }

    .stat-pill strong {
      display: block;
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--accent);
    }

    .stat-pill span {
      font-size: 0.74rem;
      color: var(--text-secondary);
    }

    /* Navigation Tabs */
    .tabs-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .segmented-control {
      display: inline-flex;
      background: rgba(120, 120, 128, 0.12);
      padding: 4px;
      border-radius: var(--radius-pill);
      gap: 4px;
      overflow-x: auto;
      max-width: 100%;
    }

    .seg-btn {
      padding: 8px 16px;
      border-radius: var(--radius-pill);
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .seg-btn.active {
      background: var(--glass-bg-strong);
      color: var(--text-primary);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    /* Book Grid */
    .books-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(var(--grid-min), 1fr));
      gap: 18px;
    }

    .book-card {
      background: var(--glass-bg-strong);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-xl);
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: var(--shadow-sm);
      transition: transform 0.22s ease, box-shadow 0.22s ease;
      position: relative;
    }

    .book-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
    }

    /* 3D Auto Cover */
    .book-cover-wrap {
      position: relative;
      height: 195px;
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 14px;
      color: #fff;
      box-shadow: inset 6px 0 14px rgba(0, 0, 0, 0.22), 0 8px 18px rgba(0, 0, 0, 0.12);
    }

    .book-cover-wrap::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 10px;
      background: linear-gradient(90deg, rgba(255,255,255,0.32), rgba(0,0,0,0.22));
    }

    .book-cover-wrap img.cover-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    .book-cover-overlay {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .cover-badge {
      align-self: flex-start;
      background: rgba(0, 0, 0, 0.34);
      backdrop-filter: blur(8px);
      padding: 3px 9px;
      border-radius: var(--radius-pill);
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .cover-title-box {
      background: linear-gradient(to top, rgba(0,0,0,0.72), rgba(0,0,0,0.12));
      margin: -14px;
      padding: 24px 14px 12px;
    }

    .cover-title-box h4 {
      font-size: 0.92rem;
      font-weight: 700;
      line-height: 1.28;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .cover-title-box p {
      font-size: 0.74rem;
      opacity: 0.88;
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .like-float-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 2;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(8px);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      box-shadow: 0 3px 10px rgba(0,0,0,0.15);
      transition: transform 0.15s ease;
    }

    .like-float-btn:hover {
      transform: scale(1.1);
    }

    .book-meta {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
    }

    .book-cat-tag {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--accent);
    }

    .book-title {
      font-size: 0.98rem;
      font-weight: 700;
      line-height: 1.32;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .book-author {
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    .book-desc {
      font-size: 0.8rem;
      color: var(--text-secondary);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-top: 2px;
    }

    .book-actions {
      display: flex;
      gap: 8px;
      margin-top: auto;
      padding-top: 6px;
    }

    .book-actions .btn {
      flex: 1;
    }

    /* Open Source Search Bar */
    .opensource-toolbar {
      background: var(--glass-bg-strong);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-xl);
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .opensource-search-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .opensource-search-row input,
    .opensource-search-row select {
      padding: 10px 14px;
      border-radius: var(--radius-md);
      border: 1px solid var(--card-border);
      background: var(--bg-base);
      color: var(--text-primary);
      font-size: 0.9rem;
      font-family: inherit;
    }

    .opensource-search-row input {
      flex: 1;
      min-width: 210px;
    }

    .topic-chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .topic-chip {
      padding: 5px 12px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--card-border);
      background: var(--bg-base);
      color: var(--text-secondary);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
    }

    .topic-chip:hover,
    .topic-chip.active {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: var(--accent);
    }

    /* Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(0, 0, 0, 0.48);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-y: auto;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-box {
      background: var(--glass-bg-strong);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-xl);
      width: 100%;
      max-width: 540px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
      box-shadow: var(--shadow-lg);
      position: relative;
      animation: modalPop 0.2s ease;
    }

    .modal-box.modal-lg {
      max-width: 860px;
    }

    @keyframes modalPop {
      from { opacity: 0; transform: scale(0.96) translateY(8px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--card-border);
    }

    .modal-header h3 {
      font-size: 1.15rem;
      font-weight: 700;
    }

    .close-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: rgba(120, 120, 128, 0.14);
      color: var(--text-primary);
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text-secondary);
    }

    .form-control {
      width: 100%;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      border: 1px solid var(--card-border);
      background: var(--bg-base);
      color: var(--text-primary);
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
    }

    .form-control:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .palette-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .palette-swatch {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      cursor: pointer;
      border: 3px solid transparent;
      transition: transform 0.15s ease;
    }

    .palette-swatch.selected {
      border-color: var(--text-primary);
      transform: scale(1.08);
    }

    /* Fullscreen Reader */
    .reader-overlay {
      position: fixed;
      inset: 0;
      z-index: 300;
      background: var(--bg-base);
      display: none;
      flex-direction: column;
    }

    .reader-overlay.open {
      display: flex;
    }

    .reader-topbar {
      background: var(--glass-bg-strong);
      border-bottom: 1px solid var(--card-border);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .reader-book-info {
      min-width: 0;
      flex: 1;
    }

    .reader-book-info h3 {
      font-size: 1rem;
